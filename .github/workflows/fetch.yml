name: Fetch programma

on:
  workflow_dispatch: # "Run workflow" button: always runs and redeploys the site

permissions:
  contents: write # commit new PDFs
  pages: write
  id-token: write

env:
  TZ: Europe/Athens # local time everywhere: file names, the page

concurrency:
  group: fetch
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      deploy: ${{ steps.save.outputs.deploy }}
    steps:
      - uses: actions/checkout@v7

      - name: Fetch latest PDF
        run: python3 fetch_programma.py

      - name: Commit new PDF
        id: save
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "New: $(python3 -c 'import json; print(json.load(open(".state.json"))["title"])')"
            git push
          fi
          if [ -f .state.json ]; then
            echo deploy=true >> "$GITHUB_OUTPUT"
          fi

      - name: Build site
        if: steps.save.outputs.deploy == 'true'
        run: python3 build_site.py

      - uses: actions/upload-pages-artifact@v5
        if: steps.save.outputs.deploy == 'true'
        with:
          path: _site

  deploy:
    needs: fetch
    if: needs.fetch.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
